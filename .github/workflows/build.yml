- name: Compile Java
  run: |
    mkdir -p "Password Generator/bin"
    javac -d "Password Generator/bin" \
      "Password Generator/src/Alphabet.java" \
      "Password Generator/src/Generator.java" \
      "Password Generator/src/Password.java" \
      "Password Generator/src/Main.java"

- name: Run Tests with JaCoCo
  run: |
    # Download JaCoCo
    wget https://repo1.maven.org/maven2/org/jacoco/org.jacoco.agent/0.8.11/org.jacoco.agent-0.8.11-runtime.jar -O jacoco-agent.jar
    wget https://repo1.maven.org/maven2/org/jacoco/org.jacoco.cli/0.8.11/org.jacoco.cli-0.8.11-nodeps.jar -O jacoco-cli.jar
    # Run with JaCoCo agent
    java -javaagent:jacoco-agent.jar=destfile=jacoco.exec -cp "Password Generator/bin" Main || true
    # Generate XML report
    java -jar jacoco-cli.jar report jacoco.exec \
      --classfiles "Password Generator/bin" \
      --sourcefiles "Password Generator/src" \
      --xml jacoco.xml

- name: SonarQube Scan
  uses: sonarsource/sonarqube-scan-action@master
  env:
    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    SONAR_HOST_URL: https://sonarcloud.io
